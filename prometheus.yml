global:
  scrape_interval: 15s

scrape_configs:
  - job_name: recurring-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8001

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8002
