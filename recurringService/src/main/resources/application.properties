spring.application.name=recurringService
server.port=8001
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# database connection
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=notifications

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Metrics for Prometheus/Grafana
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# AWS AppConfig
aws.appconfig.application-identifier=${AWS_APPCONFIG_APPLICATION_IDENTIFIER:RecurringNotificationService}
aws.appconfig.environment-identifier=${AWS_APPCONFIG_ENVIRONMENT_IDENTIFIER:DEV}
aws.appconfig.configuration-profile-identifier=${AWS_APPCONFIG_CONFIGURATION_PROFILE_IDENTIFIER:NotificationService-Config}
aws.appconfig.minimum-poll-interval-seconds=${AWS_APPCONFIG_MINIMUM_POLL_INTERVAL_SECONDS:30}

logging.file.name=/Users/mohantyrohan3/Rohan/Projects/Java_Projects/Recurring Notification System/logs/${spring.application.name}.log
